
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="45%" stop-color="#1e1035" />
      <stop offset="85%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0f0720" />
    </linearGradient>

    <!-- Studio Podium Glow -->
    <radialGradient id="podiumGlow" cx="50%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#e879f9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Soft Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LUXURY BACKGROUND -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />
  <circle cx="540" cy="780" r="480" fill="url(#podiumGlow)" />

  <!-- DECORATIVE DIAMOND SPARKLES -->
  <g fill="#ffffff" opacity="0.6" filter="url(#glow)">
    <!-- Sparkle 1 -->
    <path d="M 200 200 Q 200 220 220 220 Q 200 220 200 240 Q 200 220 180 220 Q 200 220 200 200 Z" />
    <!-- Sparkle 2 -->
    <path d="M 880 280 Q 880 300 900 300 Q 880 300 880 320 Q 880 300 860 300 Q 880 300 880 280 Z" />
    <!-- Sparkle 3 -->
    <path d="M 150 750 Q 150 765 165 765 Q 150 765 150 780 Q 150 765 135 765 Q 150 765 150 750 Z" />
    <!-- Sparkle 4 -->
    <path d="M 920 820 Q 920 835 935 835 Q 920 835 920 850 Q 920 835 905 835 Q 920 835 920 820 Z" />
  </g>

  <!-- LUXURY TOP BADGE -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="340" height="64" rx="32" fill="rgba(30, 16, 53, 0.75)" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="170" y="42" font-family="'Segoe UI', Tahoma, sans-serif" font-size="24" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">✨ NOVA COSMETICS</text>
  </g>

  <!-- GAZA BADGE -->
  <g transform="translate(740, 60)">
    <rect x="0" y="0" width="280" height="64" rx="32" fill="rgba(30, 16, 53, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="140" y="42" font-family="'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">🇵🇸 قطاع غزة</text>
  </g>

  <!-- MAIN PRODUCT CONTAINER (STUDIO FRAMED & SHADOWED) -->
  <g filter="url(#shadow)">
    <!-- White Luxury Mirror Inner Frame -->
    <rect x="220" y="180" width="640" height="640" rx="36" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- Clip Path for Product Image -->
    <clipPath id="prodClip">
      <rect x="224" y="184" width="632" height="632" rx="32" />
    </clipPath>
    <!-- Actual Product Image -->
    <image href="https://novapure.beauty/uploads/51b42d8a-1b49-4e04-9c0d-a1150744f69e.jpg" x="224" y="184" width="632" height="632" preserveAspectRatio="xMidYMid slice" clip-path="url(#prodClip)" />
  </g>

  <!-- STUDIO BASE PODIUM LINES -->
  <ellipse cx="540" cy="850" rx="360" ry="24" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" filter="url(#glow)" />

  <!-- BOTTOM CAPTION CARD -->
  <g transform="translate(90, 890)">
    <rect x="0" y="0" width="900" height="120" rx="28" fill="rgba(15, 7, 32, 0.92)" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="450" y="52" font-family="'Segoe UI', Tahoma, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">مزيل ماسكارا كلين كوين السريع للرموش - الوجبة 24</text>
    <text x="450" y="94" font-family="'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">🏷️ السعر الموحد: 50 شيكل • توصيل ل باب البيت في غزة 🚚🇵🇸</text>
  </g>
</svg>
